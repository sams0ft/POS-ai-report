[project]
name = "pos-reportes-ia"
version = "0.1.0"
description = "Servicio de Reportes IA para sistema POS"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
